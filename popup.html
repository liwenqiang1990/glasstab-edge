<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GlassTab</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f172a;
      --panel: rgba(15, 23, 42, 0.82);
      --line: rgba(148, 163, 184, 0.22);
      --line-strong: rgba(226, 232, 240, 0.28);
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-2: #fb7185;
      --shadow: 0 18px 48px rgba(2, 6, 23, 0.28);
      --shadow-soft: 0 10px 28px rgba(2, 6, 23, 0.18);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      width: 400px;
      min-height: 620px;
      font-family: "Segoe UI Variable Display", "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(56, 189, 248, 0.28), transparent 38%),
        radial-gradient(circle at bottom right, rgba(251, 113, 133, 0.24), transparent 34%),
        radial-gradient(circle at 50% 110%, rgba(249, 115, 22, 0.14), transparent 32%),
        var(--bg);
      color: var(--text);
    }

    .wrap {
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .panel {
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.9), rgba(15, 23, 42, 0.76));
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 14px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(20px);
    }

    .title {
      font-size: 19px;
      font-weight: 700;
      margin: 0 0 4px;
      letter-spacing: -0.03em;
    }

    .url {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      word-break: break-all;
      line-height: 1.45;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .stack {
      display: grid;
      gap: 10px;
    }

    button {
      border: 0;
      border-radius: 14px;
      padding: 12px;
      background: linear-gradient(180deg, rgba(51, 65, 85, 0.92), rgba(30, 41, 59, 0.9));
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s ease, opacity 0.2s ease, box-shadow 0.2s ease;
      box-shadow: var(--shadow-soft);
    }

    button:hover:not(:disabled) {
      transform: translateY(-2px);
      background: linear-gradient(180deg, rgba(71, 85, 105, 0.96), rgba(51, 65, 85, 0.94));
      box-shadow: var(--shadow);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    .primary {
      background: linear-gradient(135deg, var(--accent), #0ea5e9);
      color: #082f49;
    }

    .accent {
      background: linear-gradient(135deg, var(--accent-2), #f97316);
      color: white;
    }

    .status {
      min-height: 18px;
      color: var(--muted);
      font-size: 12px;
    }

    .summary {
      white-space: pre-wrap;
      line-height: 1.55;
      font-size: 13px;
      color: #f8fafc;
      min-height: 20px;
    }

    .tip {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
      margin: 0;
    }

    .bookmark-list {
      display: grid;
      gap: 8px;
      max-height: 320px;
      overflow-y: auto;
    }

    .bookmark-item {
      display: grid;
      grid-template-columns: 32px minmax(0, 1fr) auto;
      gap: 10px;
      align-items: start;
      padding: 10px;
      border-radius: 14px;
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.72), rgba(30, 41, 59, 0.62));
      border: 1px solid rgba(148, 163, 184, 0.14);
      cursor: pointer;
      transition: transform 0.18s ease, background 0.18s ease, border-color 0.18s ease;
    }

    .bookmark-item:hover {
      transform: translateY(-1px);
      background: linear-gradient(180deg, rgba(30, 41, 59, 0.9), rgba(51, 65, 85, 0.72));
      border-color: var(--line-strong);
    }

    .bookmark-icon {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      overflow: hidden;
      background: linear-gradient(180deg, rgba(226, 232, 240, 0.18), rgba(148, 163, 184, 0.08));
      border: 1px solid rgba(148, 163, 184, 0.16);
    }

    .bookmark-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .bookmark-title {
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .bookmark-site {
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    .bookmark-summary {
      color: #e2e8f0;
      font-size: 11px;
      line-height: 1.45;
      margin-top: 4px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .bookmark-delete {
      width: 26px;
      height: 26px;
      padding: 0;
      border-radius: 10px;
      background: rgba(239, 68, 68, 0.16);
      color: #fecaca;
      font-size: 12px;
    }

    .bookmark-delete:hover:not(:disabled) {
      background: rgba(239, 68, 68, 0.28);
    }

    .search-input {
      width: 100%;
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 16px;
      padding: 12px 14px;
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.94), rgba(15, 23, 42, 0.82));
      color: var(--text);
      outline: none;
      transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease;
    }

    .search-input:hover,
    .search-input:focus {
      transform: translateY(-1px);
      border-color: var(--line-strong);
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.98), rgba(30, 41, 59, 0.86));
    }

    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.78);
      color: var(--muted);
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 600;
      transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease;
    }

    .chip:hover {
      transform: translateY(-1px);
      border-color: var(--line-strong);
      background: rgba(30, 41, 59, 0.88);
    }

    .chip.active {
      background: rgba(56, 189, 248, 0.22);
      color: #e0f2fe;
      border-color: rgba(56, 189, 248, 0.42);
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="panel">
      <h1 class="title" id="page-title">读取当前页面中</h1>
      <p class="url" id="page-url"></p>
    </section>

    <section class="panel">
      <div class="grid">
        <button class="primary" id="bookmark-btn">加入书签并摘要</button>
        <button class="accent" id="bookmark-summary-btn">仅保存书签</button>
        <button id="summary-btn">仅生成摘要</button>
        <button id="shortcut-btn">添加为 Shortcut</button>
      </div>
    </section>

    <section class="panel">
      <div class="status" id="status"></div>
      <div class="summary" id="summary"></div>
    </section>

    <section class="panel">
      <div class="grid">
        <button id="bookmarks-page-btn">书签页面</button>
        <button id="options-btn">打开设置</button>
      </div>
      <p class="tip">AI 与 WebDAV 都在设置页配置。书签加入后会在新标签页展示，logo 会自动补抓并保存在本地。</p>
    </section>

    <section class="panel">
      <div class="stack">
        <div class="section-head">
          <div class="status">书签浏览与管理</div>
          <div class="status" id="bookmark-count"></div>
        </div>
        <input class="search-input" id="bookmark-search" type="text" placeholder="搜索标题、网址、摘要、标签">
        <div class="chip-row" id="tag-filters"></div>
        <div class="bookmark-list" id="bookmark-list"></div>
      </div>
    </section>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
