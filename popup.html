<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GlassTab</title>
  <link rel="stylesheet" href="styles/ui.css">
  <style>
    body { width: 340px; background: var(--bg); }

    .section { padding: 12px 12px 0; }

    .page-card { display: flex; align-items: center; gap: 10px; padding: 2px 2px 0; }
    .page-card .app-icon { --tile: 34px; }
    .page-title { font-weight: 600; font-size: 13px; }
    .page-url { font-size: 11.5px; color: var(--text-3); }

    .actions { display: grid; gap: 8px; }

    .btn-primary.is-saved { background: linear-gradient(180deg, color-mix(in srgb, var(--ok) 86%, #fff), var(--ok)); box-shadow: 0 0 0 0.5px color-mix(in srgb, var(--ok) 70%, #000); }

    .group-box .row { min-height: 38px; padding: 6px 10px; }
    .group-box .row-label b { font-size: 12.5px; }
    .group-box select { width: auto; min-width: 88px; min-height: 24px; padding: 2px 6px; font-size: 12px; }

    .result {
      padding: 9px 11px;
      border-radius: 10px;
      background: var(--surface);
      box-shadow: 0 0 0 0.5px var(--line);
      font-size: 12.5px;
    }

    .result .status { color: var(--text-2); }
    .result .status.error { color: var(--danger); }
    .result .summary { margin-top: 3px; line-height: 1.55; }

    .list-head { display: flex; align-items: center; justify-content: space-between; margin: 14px 2px 8px; font-size: 12px; font-weight: 700; }
    .list-head span:last-child { font-weight: 400; color: var(--text-3); }

    .chips { margin: 8px 0 2px; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
    .chips .chip { flex-shrink: 0; height: 22px; font-size: 11.5px; padding: 0 9px; }

    .list { max-height: 236px; margin: 6px -6px 0; padding: 0 6px; overflow-y: auto; }

    .item {
      position: relative;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 32px 6px 6px;
      border-radius: 7px;
      cursor: default;
    }

    .item:hover { background: var(--accent); color: #fff; }
    .item:hover .item-sub { color: rgba(255, 255, 255, 0.8); }
    .item .app-icon { --tile: 26px; }
    .item-body { min-width: 0; flex: 1; }
    .item-title { font-size: 12.5px; font-weight: 500; }
    .item-sub { font-size: 11.5px; color: var(--text-3); }

    .item .icon-button { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); opacity: 0; color: #fff; }
    .item:hover .icon-button { opacity: 1; }
    .item .icon-button:hover { background: rgba(255, 255, 255, 0.2); color: #fff; }

    .foot { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; padding: 4px 6px; border-top: 0.5px solid var(--line); }
    .foot .muted { font-size: 11px; color: var(--text-3); }
  </style>
</head>
<body>
  <div class="section">
    <div class="page-card">
      <span id="page-icon"></span>
      <div style="min-width:0; flex:1">
        <div class="page-title ellipsis" id="page-title">读取当前页面…</div>
        <div class="page-url ellipsis" id="page-url"></div>
      </div>
    </div>
  </div>

  <div class="section actions">
    <button class="btn btn-primary btn-lg" id="bookmark-btn" type="button"></button>
    <div class="group-box">
      <div class="row">
        <span class="row-label"><b id="summary-toggle-label">同时生成 AI 摘要</b></span>
        <label class="switch"><input type="checkbox" id="with-summary"><span></span></label>
      </div>
      <div class="row">
        <span class="row-label"><b>加到快捷方式</b></span>
        <span class="row-control" style="flex-basis:auto">
          <select class="input" id="group-select" aria-label="分组"></select>
          <button class="btn" id="shortcut-btn" type="button" style="height:24px;padding:0 10px;font-size:12px">添加</button>
        </span>
      </div>
      <div class="row">
        <span class="row-label"><b>只生成摘要，不收藏</b></span>
        <button class="btn" id="summary-btn" type="button" style="height:24px;padding:0 10px;font-size:12px">生成</button>
      </div>
    </div>
  </div>

  <div class="section" id="result-wrap" hidden>
    <div class="result">
      <div class="status" id="status"></div>
      <div class="summary" id="summary"></div>
    </div>
  </div>

  <div class="section">
    <div class="list-head"><span>我的书签</span><span id="bookmark-count"></span></div>
    <div class="search-field" id="search-wrap"><input id="bookmark-search" type="text" placeholder="搜索"></div>
    <div class="chips" id="tag-filters"></div>
    <div class="list" id="bookmark-list"></div>
  </div>

  <div class="foot">
    <button class="btn-text" id="bookmarks-page-btn" type="button"></button>
    <span class="muted" id="sync-meta"></span>
    <button class="btn-text" id="options-btn" type="button"></button>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
