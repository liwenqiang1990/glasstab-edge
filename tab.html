<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GlassTab</title>
  <style>
    :root {
      --text: #f8fafc;
      --muted: rgba(226, 232, 240, 0.7);
      --line: rgba(255, 255, 255, 0.16);
      --line-strong: rgba(255, 255, 255, 0.24);
      --glass: rgba(255, 255, 255, 0.1);
      --glass-strong: rgba(255, 255, 255, 0.16);
      --shadow: 0 20px 60px rgba(15, 23, 42, 0.16);
      --shadow-soft: 0 10px 30px rgba(15, 23, 42, 0.08);
      --accent: #7dd3fc;
      --accent-warm: #f9a8d4;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI Variable Display", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background: #020617;
    }

    button, input, select, textarea {
      font: inherit;
    }

    .app-shell {
      position: relative;
      min-height: 100vh;
      padding: 28px 28px 96px;
      overflow-x: hidden;
    }

    .wallpaper {
      position: fixed;
      inset: 0;
      z-index: -2;
      transition: background 0.8s ease;
    }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(circle at 12% 14%, rgba(125, 211, 252, 0.16), transparent 26%),
        radial-gradient(circle at 86% 18%, rgba(249, 168, 212, 0.14), transparent 24%),
        linear-gradient(180deg, rgba(2, 6, 23, 0.08) 0%, rgba(2, 6, 23, 0.4) 100%);
      backdrop-filter: blur(8px);
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 34px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .brand-title {
      font-size: 28px;
      font-weight: 700;
      margin: 0;
      letter-spacing: -0.05em;
      text-shadow: 0 2px 18px rgba(15, 23, 42, 0.18);
    }

    .brand-subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0.02em;
    }

    .toolbar-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .ghost-btn, .primary-btn, .mini-btn {
      border: 1px solid var(--line);
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0.06));
      color: var(--text);
      backdrop-filter: blur(20px);
      box-shadow: var(--shadow-soft);
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .ghost-btn:hover, .primary-btn:hover, .mini-btn:hover {
      transform: translateY(-2px);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.08));
      border-color: var(--line-strong);
      box-shadow: var(--shadow);
    }

    .ghost-btn, .primary-btn {
      padding: 10px 16px;
      font-weight: 600;
    }

    .primary-btn {
      background: linear-gradient(135deg, rgba(125, 211, 252, 0.28), rgba(249, 168, 212, 0.18));
    }

    .hero {
      text-align: center;
      margin-bottom: 34px;
      user-select: none;
    }

    .time-text {
      margin: 0;
      font-size: clamp(54px, 8vw, 96px);
      line-height: 0.92;
      font-weight: 250;
      letter-spacing: -0.06em;
      text-shadow: 0 8px 30px rgba(15, 23, 42, 0.22);
    }

    .date-text {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 14px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .search-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }

    .search-card {
      padding: 0;
      background: transparent;
      border: 0;
      box-shadow: none;
      backdrop-filter: none;
    }

    .search-form {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 0;
    }

    .search-form select,
    .search-form input,
    .modal-body input {
      border: 0;
      outline: none;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0.08));
      color: var(--text);
      border-radius: 20px;
      padding: 13px 15px;
      backdrop-filter: blur(22px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: var(--shadow-soft);
      transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
    }

    .search-form select:hover,
    .search-form input:hover,
    .search-form select:focus,
    .search-form input:focus {
      transform: translateY(-1px);
      border-color: var(--line-strong);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0.1));
      box-shadow: var(--shadow);
    }

    .search-form select {
      width: 122px;
      flex: 0 0 auto;
    }

    .search-form input {
      width: 100%;
      min-width: 0;
    }

    .panel {
      padding: 10px 0 0;
      margin-bottom: 24px;
      background: transparent;
      border: 0;
      box-shadow: none;
      backdrop-filter: none;
    }

    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .panel-title {
      margin: 0;
      font-size: 21px;
      letter-spacing: -0.03em;
    }

    .panel-subtitle {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .shortcut-grid {
      display: grid;
      gap: 6px 12px;
      align-items: start;
    }

    .grid-compact { grid-template-columns: repeat(10, minmax(0, 1fr)); }
    .grid-standard { grid-template-columns: repeat(8, minmax(0, 1fr)); }
    .grid-comfortable { grid-template-columns: repeat(6, minmax(0, 1fr)); }

    .shortcut-card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 10px 4px 8px;
      text-align: center;
      border-radius: 16px;
      background: transparent;
      border: 0;
      cursor: pointer;
      transition: transform 0.22s ease, background 0.22s ease;
      min-height: 92px;
    }

    .shortcut-card:hover {
      transform: translateY(-5px);
      background: radial-gradient(circle at top, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.02));
    }

    .shortcut-icon {
      width: 50px;
      height: 50px;
      border-radius: 18px;
      background: transparent;
      display: grid;
      place-items: center;
      overflow: hidden;
      border: 0;
      box-shadow: none;
      transition: transform 0.22s ease;
    }

    .shortcut-card:hover .shortcut-icon {
      transform: translateY(-1px);
    }

    .shortcut-icon img, .bookmark-icon img, .preview-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .shortcut-name {
      width: 100%;
      max-width: 72px;
      overflow: hidden;
      font-size: 12px;
      line-height: 1.25;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      white-space: normal;
      min-height: 30px;
      color: rgba(248, 250, 252, 0.92);
    }

    .shortcut-tools {
      position: absolute;
      top: 2px;
      right: 4px;
      display: flex;
      gap: 6px;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .shortcut-card:hover .shortcut-tools,
    .bookmark-card:hover .bookmark-tools {
      opacity: 1;
    }

    .mini-btn {
      width: 28px;
      height: 28px;
      padding: 0;
      display: grid;
      place-items: center;
      font-size: 14px;
      border-radius: 10px;
    }

    .add-card {
      opacity: 0.9;
    }

    .add-card .shortcut-icon {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0.08));
      border: 1px dashed rgba(255, 255, 255, 0.18);
      box-shadow: var(--shadow-soft);
    }

    .bookmark-list {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px 14px;
    }

    .bookmark-card {
      position: relative;
      display: grid;
      grid-template-columns: 32px minmax(0, 1fr);
      gap: 10px;
      align-items: center;
      padding: 10px 12px;
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.09), rgba(255, 255, 255, 0.04));
      border: 1px solid rgba(255, 255, 255, 0.1);
      cursor: pointer;
      transition: transform 0.22s ease, background 0.22s ease, border-color 0.22s ease, box-shadow 0.22s ease;
      min-height: 62px;
      box-shadow: var(--shadow-soft);
    }

    .bookmark-card:hover {
      transform: translateY(-3px);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0.06));
      border-color: var(--line-strong);
      box-shadow: var(--shadow);
    }

    .bookmark-icon {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.22), rgba(255, 255, 255, 0.1));
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .bookmark-headline {
      margin: 0;
      display: flex;
      align-items: baseline;
      gap: 8px;
      min-width: 0;
    }

    .bookmark-title {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 0 1 auto;
      min-width: 0;
    }

    .bookmark-site-inline {
      color: var(--muted);
      font-size: 11px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1 1 auto;
    }

    .bookmark-summary-inline {
      margin: 3px 0 0;
      color: rgba(248, 250, 252, 0.74);
      font-size: 11px;
      line-height: 1.35;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .bookmark-tools {
      position: absolute;
      top: 6px;
      right: 6px;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .empty-state {
      border: 1px dashed rgba(255, 255, 255, 0.18);
      border-radius: 20px;
      padding: 20px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    .floating-footer {
      position: fixed;
      right: 22px;
      bottom: 18px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      padding: 8px;
      border-radius: 999px;
      background: rgba(2, 6, 23, 0.12);
      backdrop-filter: blur(14px);
    }

    .status-line {
      color: var(--muted);
      font-size: 12px;
      min-height: 18px;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(2, 6, 23, 0.56);
      backdrop-filter: blur(16px);
      padding: 18px;
    }

    .modal-card {
      width: min(520px, 100%);
      border: 1px solid var(--line);
      border-radius: 24px;
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.94), rgba(15, 23, 42, 0.88));
      box-shadow: 0 30px 80px rgba(2, 6, 23, 0.45);
      overflow: hidden;
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .modal-body {
      padding: 20px;
      display: grid;
      gap: 14px;
    }

    .modal-body label {
      display: grid;
      gap: 8px;
      font-size: 13px;
      color: #cbd5e1;
      font-weight: 600;
    }

    .preview-row {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .preview-box {
      width: 72px;
      height: 72px;
      border-radius: 22px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      padding: 0 20px 20px;
      flex-wrap: wrap;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 1320px) {
      .grid-compact { grid-template-columns: repeat(6, minmax(0, 1fr)); }
    }

    @media (max-width: 1080px) {
      .search-grid { grid-template-columns: 1fr; }
      .grid-compact { grid-template-columns: repeat(8, minmax(0, 1fr)); }
      .grid-standard { grid-template-columns: repeat(6, minmax(0, 1fr)); }
      .grid-comfortable { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .bookmark-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 760px) {
      .app-shell { padding: 18px 18px 110px; }
      .grid-compact { grid-template-columns: repeat(5, minmax(0, 1fr)); }
      .grid-standard { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .grid-comfortable { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .bookmark-list { grid-template-columns: 1fr; }
      .bookmark-card { grid-template-columns: 30px 1fr; }
      .bookmark-icon { width: 30px; height: 30px; }
      .bookmark-headline { gap: 6px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="logic.js"></script>
</body>
</html>
