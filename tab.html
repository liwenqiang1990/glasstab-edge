<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新标签页</title>
  <link rel="icon" href="icons/glasstab-32.png">
  <link rel="stylesheet" href="styles/tab.css">
</head>
<body>
  <div class="wp is-hidden" id="wp-a"></div>
  <div class="wp is-hidden" id="wp-b"></div>
  <div class="shade"></div>

  <nav class="dock glass" id="dock" aria-label="分组"></nav>

  <header class="topbar">
    <button class="icon-btn glass" type="button" id="sync-btn" hidden></button>
    <button class="icon-btn glass" type="button" id="drawer-btn" title="书签"></button>
    <a class="icon-btn glass" href="options.html?returnTo=tab" id="settings-btn" title="设置"></a>
  </header>

  <main class="stage">
    <section class="hero">
      <div class="date" id="date"></div>
      <div class="clock" id="clock"></div>
    </section>

    <form class="search" id="search-form" autocomplete="off">
      <span class="search-icon" id="search-icon"></span>
      <input id="search-input" type="text" placeholder="搜索网页、书签、历史，或输入网址" aria-label="搜索">
      <button class="engine-btn" type="button" id="engine-btn" aria-haspopup="menu"></button>
      <div class="engine-menu menu material" id="engine-menu" role="menu" hidden></div>
    </form>

    <section class="launchpad" id="shortcuts" aria-label="快捷方式"></section>
  </main>

  <aside class="drawer material" id="drawer" aria-label="书签" hidden></aside>

  <footer class="footer">
    <div id="credit"></div>
    <button class="icon-btn glass" type="button" id="appearance-btn" title="外观与壁纸"></button>
  </footer>

  <div class="popover material" id="appearance" hidden></div>
  <div class="menu material" id="menu" role="menu" hidden></div>
  <div id="modal-root"></div>
  <div class="toast material" id="toast" role="status" hidden></div>

  <script type="module" src="logic.js"></script>
</body>
</html>
