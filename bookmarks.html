<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>书签 · GlassTab</title>
  <link rel="stylesheet" href="styles/ui.css">
  <style>
    .page { width: min(880px, 100%); margin: 0 auto; padding: 28px 20px 80px; }

    .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
    .head h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }

    .filters {
      position: sticky;
      top: 0;
      z-index: 5;
      display: grid;
      gap: 10px;
      margin: 0 -20px 6px;
      padding: 10px 20px;
      background: color-mix(in srgb, var(--bg) 82%, transparent);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      backdrop-filter: blur(20px) saturate(180%);
    }

    .count { font-size: 12px; color: var(--text-3); }

    .list { border-radius: 10px; background: var(--surface); box-shadow: 0 0 0 0.5px var(--line), 0 1px 2px rgba(0, 0, 0, 0.04); overflow: hidden; }

    .bm-row {
      position: relative;
      display: grid;
      grid-template-columns: 36px minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      padding: 10px 12px;
      color: inherit;
      text-decoration: none;
    }

    .bm-row:hover { background: var(--hover); }
    .bm-row .app-icon { --tile: 36px; }
    .bm-row + .bm-row::before { content: ""; position: absolute; top: 0; left: 60px; right: 0; border-top: 0.5px solid var(--line); }

    .bm-line { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
    .bm-title { font-weight: 600; }
    .bm-host { flex-shrink: 0; font-size: 12px; color: var(--text-3); }
    .bm-summary { margin-top: 1px; color: var(--text-2); }
    .bm-notes { margin-top: 1px; font-size: 12px; color: var(--text-3); }
    .bm-tags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 5px; }

    .bm-side { display: flex; align-items: center; gap: 2px; }
    .bm-date { margin-right: 4px; font-size: 12px; color: var(--text-3); white-space: nowrap; }
    .bm-row .icon-button { opacity: 0; }
    .bm-row:hover .icon-button, .bm-row .icon-button:focus-visible { opacity: 1; }

    @media (max-width: 640px) { .bm-date, .bm-host { display: none; } }
  </style>
</head>
<body>
  <main class="page">
    <header class="head">
      <div>
        <a class="btn-text" href="tab.html" style="margin-left:-8px">← 返回新标签页</a>
        <h1>书签</h1>
      </div>
      <div class="head-actions">
        <a class="btn-text" href="options.html?returnTo=tab" id="options-link"></a>
      </div>
    </header>

    <section class="filters">
      <div class="search-field" id="search-wrap"><input id="bookmark-search" type="text" placeholder="搜索标题、网址、摘要、标签" autofocus></div>
      <div class="chips" id="tag-filters"></div>
      <div class="count" id="bookmark-count"></div>
    </section>

    <section class="list" id="bookmark-list"></section>
  </main>

  <div class="toast" id="toast" hidden></div>

  <script type="module" src="bookmarks.js"></script>
</body>
</html>
