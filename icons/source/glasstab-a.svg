<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ED6FF"/>
      <stop offset="0.48" stop-color="#2F7BFF"/>
      <stop offset="1" stop-color="#6B4BFF"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#E6EEFF"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1A2366" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="2" y="2" width="124" height="124" rx="29" fill="url(#bg)"/>
  <rect x="2" y="2" width="124" height="62" rx="29" fill="url(#gloss)"/>
  <g filter="url(#drop)">
    <!-- 浏览器标签页：左上角的页签 + 窗口主体 -->
    <path d="M24 49 a10 10 0 0 1 10-10 h20 a9 9 0 0 1 7.6 4.2 l3.2 5 a4 4 0 0 0 3.4 1.8 H94 a10 10 0 0 1 10 10 v31 a10 10 0 0 1-10 10 H34 a10 10 0 0 1-10-10z" fill="url(#pane)"/>
  </g>
  <!-- 书签丝带 -->
  <path d="M77 50 h15 v25 l-7.5-5.6 L77 75z" fill="#2F7BFF"/>
  <rect x="34" y="68" width="30" height="6" rx="3" fill="#B9CCF5"/>
  <rect x="34" y="80" width="20" height="6" rx="3" fill="#D3DFF8"/>
</svg>
