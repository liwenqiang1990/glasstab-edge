<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ED6FF"/>
      <stop offset="0.48" stop-color="#2F7BFF"/>
      <stop offset="1" stop-color="#6B4BFF"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#E3ECFF" stop-opacity="0.92"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1A2366" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="2" y="2" width="124" height="124" rx="29" fill="url(#bg)"/>
  <rect x="2" y="2" width="124" height="62" rx="29" fill="url(#gloss)"/>
  <!-- macOS 窗口：红黄绿三个按钮 + 书签丝带 -->
  <g filter="url(#drop)">
    <rect x="22" y="32" width="84" height="66" rx="12" fill="url(#pane)"/>
  </g>
  <circle cx="35" cy="44" r="4.5" fill="#FF5F57"/>
  <circle cx="48" cy="44" r="4.5" fill="#FEBC2E"/>
  <circle cx="61" cy="44" r="4.5" fill="#28C840"/>
  <path d="M80 32 h15 v28 l-7.5-5.6 L80 60z" fill="#2F7BFF"/>
  <rect x="33" y="62" width="34" height="6" rx="3" fill="#B9CCF5"/>
  <rect x="33" y="75" width="24" height="6" rx="3" fill="#D3DFF8"/>
</svg>
